name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: amd64
            artifact: skk-popup-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            artifact: skk-popup-linux-arm64
          - os: macos-14
            target: darwin
            arch: arm64
            artifact: skk-popup-darwin-arm64
          - os: windows-latest
            target: windows
            arch: amd64
            artifact: skk-popup-windows-amd64.exe
          - os: windows-latest
            target: windows
            arch: arm64
            artifact: skk-popup-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          else
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          fi
          wails3 task ${{ matrix.target }}:build ARCH=${{ matrix.arch }}
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp bin/skk-popup.exe bin/${{ matrix.artifact }}
            wails3 task windows:msix ARCH=${{ matrix.arch }}
          else
            cp bin/skk-popup bin/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/${{ matrix.artifact }}
            bin/skk-popup-windows-*.msix
          if-no-files-found: error

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
